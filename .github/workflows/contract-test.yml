name: Contract Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'contracts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'contracts/**'

jobs:
  test:
    name: Test Soroban Contract
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      working-directory: ./contracts/bounty_escrow
      run: cargo test --verbose
    
    - name: Run clippy
      working-directory: ./contracts/bounty_escrow
      run: cargo clippy -- -D warnings
    
    - name: Check formatting
      working-directory: ./contracts/bounty_escrow
      run: cargo fmt -- --check
